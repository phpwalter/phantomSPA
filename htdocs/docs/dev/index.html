<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhantomSPA Developer Docs</title>
    <link rel="icon" href="/src/assets/images/favicon.ico" />

    <!-- Prism.js Theme (Okaidia - Dark theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css" />

    <!-- Prism.js Plugins CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-highlight/prism-line-highlight.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/command-line/prism-command-line.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/toolbar/prism-toolbar.min.css" />

    <!-- Base Styles (AFTER Prism CSS to override) -->
    <link rel="stylesheet" href="/docs/dev/css/prose.css">
    <link rel="stylesheet" href="/docs/dev/css/styles.css?v=8">

    <!-- Disable Prism.js automatic highlighting -->
    <!-- We'll manually trigger highlighting after applying per-block configuration -->
    <!-- CRITICAL: Only set manual flag, don't initialize the whole Prism object -->
    <script>
        // Only set the manual flag - let Prism.js initialize everything else
        window.Prism = window.Prism || {};
        window.Prism.manual = true;
        // Ensure plugins object exists for plugins to register
        window.Prism.plugins = window.Prism.plugins || {};
    </script>

</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="/" class="brand">
            <img src="/src/assets/images/pSPA.icon.png" alt="PhantomSPA Icon" height="32px">
            <strong>PhantomSPA</strong>
            <small>Zero dependencies. Full control.</small>
        </a>
    </div>
</header>

<div class="shell">
    <!-- ⬅️ Sidebar -->
    <aside id="site-nav" class="site-nav" data-plugin="nav-tree" aria-label="Developer Navigation"></aside>

    <!-- 🧾 Main Content -->
    <main class="site-main" role="main" id="app-shell" data-config="/docs/dev/conf/app-config.json"></main>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <p>&copy; <span id="year"></span> PhantomSPA Dev — MIT License</p>
    </div>
</footer>

<!-- Auto update year -->
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
</script>

<!-- Prism.js Core + Languages -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

<!-- Prism.js Plugins -->
<!-- REMOVED: Plugins are now loaded dynamically by router.js via prism-plugin-loader.js -->
<!-- This ensures correct load order and prevents caching issues -->

<!-- 📦 Load Kernel -->
<script type="module" src="/src/core/spa.js"></script>

<!-- 🧭 Router -->
<script type="module" src="/src/router.js"
        data-nav="/docs/dev/conf/nav.json"
        data-main="#app-shell"
        data-aside="#site-nav"
        data-active-class="active"
        data-query-mode="array">
</script>


<!-- PANELS, Enhancers, etc. -->
<script type="module" src="/src/enhancers/panels.js"></script>

</body>
</html>
