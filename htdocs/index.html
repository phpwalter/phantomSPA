    <!-- Apple touch icons -->
    <link rel="apple-touch-icon"                 href="/library/assets/images/apple/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/library/assets/images/apple/apple-touch-icon-114x114.png">

    <!-- Preconnects for faster Shield Icons -->

    <!-- Preconnects for faster Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1&display=swap" />

    <link rel="stylesheet" href="assets/css/index.css">

    <script src="assets/js/index.js"></script>

</div>

<div class="wrap">
    <!-- Vector-first banner with PNG fallback -->
    <picture>
        <source srcset="/src/assets/images/pSPA.banner.png" type="image/svg+xml">
        <source srcset="/phantom/docs/assets/img/banner.png 1x, /phantom/docs/assets/img/banner@2x.png 2x" type="image/png">
        <img class="banner" src="library/assets/images/spa-banner.png" alt="PhantomSPA — Invisible, configurable, plug-in SPA engine.">
    </picture>

    <div class="cards" role="navigation" aria-label="Documentation and App">
        <a class="card" href="/docs/user/" data-space="user" aria-label="User Documentation">
            <span class="ms" aria-hidden="true">menu_book</span>
            <span>User Docs</span>
        </a>
        <a class="card" href="/docs/dev" data-space="dev" aria-label="Developer Documentation">
            <span class="ms" aria-hidden="true">code</span>

        </a>
        <a class="card" href="/phantom/app/" aria-label="Sample App">

            <span>Sample App</span>
        </a>

<!-- Full-width footer bar -->
<div class="footer-bar" role="contentinfo">
    <span class="footer-copy">Copyright © <span id="year"></span> · Built with PhantomSPA&trade;</span>
    <a class="btn-login" href="/phantom/app/login" data-hardnav="true" aria-label="Login">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor"
                  d="M10.09 15.59 11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
        </svg>
        <span>Login</span>
    </a>
</div>

<!-- Auto-update year -->
<script>
    (function(){
        var y=document.getElementById('year');
        if(y) y.textContent=new Date().getFullYear();
    }());
</script>
</body>
</html>
